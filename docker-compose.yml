version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw:/app/data/raw
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: always

  ui:
    build: .
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "src/ui/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    restart: always
